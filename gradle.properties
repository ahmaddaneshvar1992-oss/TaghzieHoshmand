# محیط سندباکس ۴ گیگ RAM دارد — کامپایل Kotlin داخل دیمن گریدل انجام می‌شود تا JVM جدا و OOM نداشته باشیم
org.gradle.jvmargs=-Xmx1792m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=448m
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
# تلاش مجدد در برابر محدودیت نرخ مخازن
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=800
